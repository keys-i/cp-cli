[package]
name = "cp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["platforms/leetcode"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/keys-i/leetcode-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"

[features]
default = ["leetcode"]
leetcode = ["dep:platform-leetcode"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

tokio = {
    version = "1",
    default-features = false,
    features = ["macros", "rt", "time"]
}

platform-leetcode = {
    path = "platforms/leetcode",
    optional = true
}

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
incremental = false
overflow-checks = true

[profile.release-max]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = "fat"
