[package]
name = "cp-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[workspace]
members = ["platforms/leetcode"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/keys-i/leetcode-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"

[features]
default = ["leetcode"]
leetcode = ["dep:platform-leetcode"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
htmd = "0.5.5"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
markup5ever_rcdom = "0.38"
pulldown-cmark = { version = "0.12", default-features = false }
pulldown-cmark-mdcat = { version = "~2.12.0", default-features = false }
ratex-parser = "0.1.14"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
term-maths = "1"
terminal-colorsaurus = "1"
textwrap = { version = "0.16", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
unicode-width = "0.2"
url.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

platform-leetcode = { path = "platforms/leetcode", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
incremental = false
overflow-checks = true

[profile.release-max]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = "fat"
