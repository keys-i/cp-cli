[package]
name = "cp-cli-platform-project-euler"
version = "3.1.9"
description = "Project Euler HTTP client used by cp-cli"
readme = "README.md"
homepage = "https://github.com/keys-i/cp-cli"
keywords = ["project-euler", "competitive-coding", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**", "/Cargo.toml", "/README.md"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "net", "io-util", "time"] }
