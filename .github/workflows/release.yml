name: Release

on:
  push:
    tags:
      - "v*"
      - "!v0.*"
      - "!v1.*"
      - "!v2.*"
      - "!v3.0.*"
      - "!v3.1.[0-7]"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0

      - name: Verify the tag and workspace versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/workflows/scripts/verify-release-tag.sh

      - name: Check package layouts
        run: cargo package --workspace --locked --no-verify

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            executable: cp-cli
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            executable: cp-cli
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            executable: cp-cli
            musl: true
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            executable: cp-cli
            musl: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            executable: cp-cli.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            executable: cp-cli.exe
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          linker_key="$(tr '[:lower:]-' '[:upper:]_' <<<"$TARGET")"
          echo "CARGO_TARGET_${linker_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build cp-cli
        run: cargo build --release --locked --target "${{ matrix.target }}" --package cp-cli

      - name: Package and verify Unix archive
        id: package_unix
        if: matrix.archive == 'tar.gz'
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash .github/workflows/scripts/package-release-unix.sh

      - name: Package and verify Windows archive
        id: package_windows
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: .github/workflows/scripts/package-release-windows.ps1

      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: ${{ steps.package_unix.outputs.path || steps.package_windows.outputs.path }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp-cli-${{ matrix.target }}
          path: ${{ steps.package_unix.outputs.path || steps.package_windows.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish crates.io packages
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish platform packages before cp-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash .github/workflows/scripts/publish-crates.sh

  bundle:
    name: Prepare release bundle
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cp-cli-*
          path: dist
          merge-multiple: true

      - name: Add native installers
        run: cp tools/scripts/install.sh tools/scripts/install.ps1 dist/

      - name: Write SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 cp-cli-*.tar.gz cp-cli-*.zip install.sh install.ps1 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS

      - name: Attest release checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp-cli-release-bundle
          path: |
            dist/cp-cli-*.tar.gz
            dist/cp-cli-*.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
