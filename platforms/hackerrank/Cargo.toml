[package]
name = "cp-cli-platform-hackerrank"
version = "0.2.0"
description = "HackerRank HTTP client used by cp-cli"
readme = false
homepage = "https://github.com/keys-i/leetcode-rs"
keywords = ["hackerrank", "competitive-coding", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**", "/Cargo.toml"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "net", "io-util", "time"] }
