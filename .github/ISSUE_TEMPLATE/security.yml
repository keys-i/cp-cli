name: Security hardening request
description: Suggest a cp-cli hardening improvement that is safe to discuss publicly.
title: "[SECURITY]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for public hardening ideas.

        Do not report an actual or suspected vulnerability here. Follow the
        [security policy](https://github.com/keys-i/cp-cli/security/policy)
        to report it privately. Do not include credentials, sessions, cookies,
        exploit details, or private data.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Harden validation for a public command argument
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cp-cli version
      description: Include `cp-cli --version` or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      placeholder: Windows 11, PowerShell 7.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - LeetCode
        - HackerRank
        - Codeforces
        - Exercism
        - Project Euler
        - HackerEarth
        - CodeChef
        - Other or not platform-specific
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Relevant command or workflow
      description: Include a safe, redacted example if there is one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current public-facing result
      description: Describe the current safe-to-disclose behaviour or limitation.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Desired hardening result
      description: State the public-facing outcome without vulnerability details.
    validations:
      required: true
  - type: checkboxes
    id: public_only
    attributes:
      label: Public disclosure confirmation
      options:
        - label: This is a public hardening request, not an actual or suspected vulnerability.
          required: true
