name: Bug report
description: Report reproducible cp-cli behaviour.
title: "[BUG]: "
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: problem list exits with an error on Codeforces
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cp-cli version
      description: Include `cp-cli --version` or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      placeholder: macOS 15.0, Apple Terminal 2.14
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - LeetCode
        - HackerRank
        - Codeforces
        - Exercism
        - Project Euler
        - HackerEarth
        - CodeChef
        - Other or not platform-specific
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and steps
      description: Include the exact command and the smallest reproduction steps. Remove secrets and session data.
      placeholder: |
        cp-cli --platform codeforces problem list
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include a short redacted error or output when useful.
    validations:
      required: true
